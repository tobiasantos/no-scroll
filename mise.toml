[tools]
java = "temurin-25"
go   = "1.27"
buf  = "1.71.0"
grpcurl = "1.9.3"

[tasks.build]
shell = "bash -c"
description = "Compila a API (Kotlin) e os servicos Go"
run = [
  "cd api && ./gradlew build -x test",
  "cd services && go build ./...",
]

[tasks.test]
shell = "bash -c"
description = "Roda os testes da API e dos servicos Go"
run = [
  "cd api && ./gradlew test",
  "cd services && go test ./...",
]

[tasks.lint]
shell = "bash -c"
description = "Verificacoes estaticas"
run = [
  "cd services && go vet ./...",
  "cd protos && buf lint",
]

[tasks."buf:gen"]
shell = "bash -c"
description = "Gera os stubs Go a partir do contrato .proto"
run = "cd protos && buf generate"

[tasks."evaluator:run"]
shell = "bash -c"
description = "Sobe o servico Go avaliador, gRPC na 50051"
run = "cd services && go run ./cmd/evaluator"

[tasks."evaluator:call"]
shell = "bash -c"
description = "Chama o avaliador com o grpcurl, com um uso acima do limite"
run = """grpcurl -plaintext -d '{"app_name":"TikTok","limit_minutes":30,"session_minutes":[25,10]}' localhost:50051 noscroll.evaluator.v1.EvaluatorService/EvaluateUsage"""

[tasks.up]
shell = "bash -c"
description = "Sobe o ambiente com Docker Compose"
run = "docker compose up -d"

[tasks.run]
shell = "bash -c"
description = "Sobe a API na 8080"
run = "cd api && ./gradlew run"

[tasks.demo]
shell = "bash -c"
description = "Cria e lista um setup na API, para ver o CRUD respondendo"
run = """
curl -s -i -X POST localhost:8080/setups -H 'Content-Type: application/json' \
  -d '{"appPackage":"com.twitter.android","appName":"X","dailyLimitMinutes":20}' | head -3
echo
curl -s localhost:8080/setups
"""

[tasks.ci]
description = "Reproduz o pipeline do CI localmente"
shell = "bash -c"
run = ["mise run lint", "mise run build", "mise run test"]
